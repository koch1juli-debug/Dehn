<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dehn-Routinen</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dehnen">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eaeff5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1424" media="(prefers-color-scheme: dark)">
<style>
:root{--bg:#eaeff5;--card:#fff;--ink:#16213a;--mut:#5d6a85;--acc:#4b4acf;--on:#fff;--rest:#d9890f;--line:#d3dbe8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1424;--card:#181f36;--ink:#edf0fa;--mut:#9aa6c4;--acc:#8c8bff;--on:#0f1424;--rest:#f0b35a;--line:#2a3354}}
:root[data-theme="dark"]{--bg:#0f1424;--card:#181f36;--ink:#edf0fa;--mut:#9aa6c4;--acc:#8c8bff;--on:#0f1424;--rest:#f0b35a;--line:#2a3354}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
:root{color-scheme:light dark}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:480px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:30px;margin:8px 0 4px;letter-spacing:-.5px}
h2{font-size:21px;margin:0 0 2px}
p{margin:4px 0 12px}
.mut{color:var(--mut)}.c{text-align:center}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.row{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}.row>*{flex:1}
.btn{border:0;border-radius:14px;padding:14px 18px;font:inherit;font-weight:700;background:var(--acc);color:var(--on);cursor:pointer}
.btn.g{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:8px 12px;font-size:15px}
.btn:disabled{opacity:.4}
.btn:focus-visible,.pick:focus-visible,.day:focus-visible,.chip:focus-visible,.pn:focus-visible,.plus:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
input,textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px;margin:4px 0 8px}
label{display:block;font-size:15px;color:var(--mut)}
.chk{display:flex;align-items:center;gap:8px;color:var(--ink);margin:4px 0 12px}
input[type=checkbox]{width:20px;height:20px;margin:0;flex:none;accent-color:var(--acc)}
.nx{color:var(--acc);letter-spacing:.2em;font-size:44px}
.gear{font-size:20px;line-height:1;flex:none}
.mv{display:flex;gap:6px}
input[type=range]{padding:0;border:0;height:32px;accent-color:var(--acc)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:10px 0}
.wd{font-size:13px;color:var(--mut);text-align:center;padding:4px 0}
.day{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;aspect-ratio:1;min-height:44px;border:1px solid transparent;border-radius:12px;background:var(--card);color:var(--ink);font:inherit;padding:2px;cursor:pointer}
.day.today{border-color:var(--mut)}
.day.sel{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.dots{display:flex;gap:2px;height:9px;align-items:center}
.dots i,.lg i{display:inline-block;width:7px;height:7px;border-radius:50%}
.pl{width:9px!important;height:9px!important;border:2px solid;background:transparent}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:6px 12px;font:inherit;font-size:15px;cursor:pointer}
.chip.on{background:var(--acc);color:var(--on);border-color:var(--acc)}
.plus{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;width:100%;min-height:56px;margin:12px 0;border:2px dashed var(--line);border-radius:14px;background:transparent;color:var(--mut);font:inherit;padding:10px;cursor:pointer}
.plus b{font-size:28px;line-height:1;color:var(--ink)}
.plus.sm{width:auto;min-height:0;margin:0;padding:4px 16px;border-radius:999px}
.plus.sm b{font-size:20px}
.prow{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:14px;padding:2px 10px 2px 4px;margin:8px 0}
.prow.cur{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.prow label{margin:0;padding:10px;display:flex}
.pn{flex:1;text-align:left;background:transparent;border:0;color:var(--ink);font:inherit;font-weight:600;padding:12px 0;cursor:pointer}
.lg{display:inline-flex;align-items:center;gap:6px;margin-right:12px}
.pic{position:absolute;left:11.5%;top:11.5%;width:77%;height:77%;border-radius:50%;object-fit:cover;background:#edeff2}
.ringw.hasimg{margin:8px auto 10px}
.tm{font-size:52px;font-weight:700;font-variant-numeric:tabular-nums;text-align:center;line-height:1.1;margin:2px 0 10px}
.hd{display:flex;align-items:center;gap:10px}.hd input{flex:1;width:auto}
.th{width:56px;height:56px;border-radius:50%;object-fit:cover;background:#edeff2;flex:none}
.side{font-weight:700;color:var(--acc);min-height:1.4em;margin:0 0 4px}
.pw{margin-bottom:8px}.pw .pick{margin-bottom:0}.dur{margin:6px 0 4px 12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ringw{position:relative;width:260px;height:260px;margin:20px auto}
.ringw svg{width:100%;height:100%}
.tr,.pg{fill:none;stroke-width:12}
.tr{stroke:var(--line)}
.pg{stroke:var(--acc);stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.rest .pg{stroke:var(--rest)}
.num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:700;font-variant-numeric:tabular-nums}
.pick{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;font:inherit;color:var(--ink);cursor:pointer}
.pick.on{border-color:var(--acc)}
.bd{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;flex:none}
.pick.on .bd{background:var(--acc);color:var(--on);border-color:var(--acc)}
@media (prefers-reduced-motion:reduce){.pg{transition:none}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const KEY="dehn-v1",C=2*Math.PI*88;
const FIX=[{"id": "f01", "name": "Nach Oben Greifen", "img": "bilder/nach-oben-greifen.png", "one": 0}, {"id": "f02", "name": "Zehen Berühren", "img": "bilder/zehen-beruehren.png", "one": 0}, {"id": "f03", "name": "Brustöffner", "img": "bilder/brustoeffner.png", "one": 0}, {"id": "f04", "name": "Seitlicher Ausfallschritt", "img": "bilder/seitlicher-ausfallschritt.png", "one": 1}, {"id": "f05", "name": "Ausfallschritt", "img": "bilder/ausfallschritt.png", "one": 1}, {"id": "f06", "name": "Kindeshaltung", "img": "bilder/kindeshaltung.png", "one": 0}, {"id": "f07", "name": "Thunderbolt", "img": "bilder/thunderbolt.png", "one": 0}, {"id": "f08", "name": "Taube", "img": "bilder/taube.png", "one": 1}, {"id": "f09", "name": "Sitzender Twist", "img": "bilder/sitzender-twist.png", "one": 1}, {"id": "f10", "name": "Knie zur Brust", "img": "bilder/knie-zur-brust.png", "one": 0}, {"id": "f11", "name": "Figur Vier Liegend", "img": "bilder/figur-vier-liegend.png", "one": 1}, {"id": "f12", "name": "Oberschenkelrückseite Liegend", "img": "bilder/oberschenkelrueckseite-liegend.png", "one": 1}, {"id": "f13", "name": "Zurückgelegter Schmetterling", "img": "bilder/zurueckgelegter-schmetterling.png", "one": 0}, {"id": "f14", "name": "Wirbelsäulen-Twist", "img": "bilder/wirbelsaeulen-twist.png", "one": 1}, {"id": "f15", "name": "Oberschenkel-Streckung", "img": "bilder/oberschenkel-streckung.png", "one": 1}, {"id": "f16", "name": "Schmetterling", "img": "bilder/schmetterling.png", "one": 0}, {"id": "f17", "name": "Sitzend Zusammenfalten", "img": "bilder/sitzend-zusammenfalten.png", "one": 0}, {"id": "f18", "name": "Pflug", "img": "bilder/pflug.png", "one": 0}];
const def={ver:3,rest:10,defSym:30,defOne:30,
ex:FIX.map(f=>({id:f.id,name:f.name,desc:"",img:f.img,one:!!f.one,fixed:true})),
routines:[{id:"rgk",name:"Ganzkörper",items:FIX.map(f=>f.id)}],
done:[]};
function load(){try{const r=localStorage.getItem(KEY);if(r){const s=JSON.parse(r);if(s.defSym==null){s.defSym=30;s.defOne=30;s.ex.forEach(e=>{if(e.sec===30)delete e.sec})}return mig(s)}}catch(e){}return mig(JSON.parse(JSON.stringify(def)))}
let S=load(),V={n:"home"},P=null,T=null,AC=null,WL=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ex=id=>S.ex.find(e=>e.id===id);
const uid=p=>p+Date.now().toString(36)+Math.floor(Math.random()*1e3);
const day=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
function streak(){let n=0,d=new Date();if(!S.done.includes(day(d)))d.setDate(d.getDate()-1);while(S.done.includes(day(d))){n++;d.setDate(d.getDate()-1)}return n}
const rs=r=>r.rest??S.rest;
const dur=(r,e)=>Math.max(10,(r&&r.secs&&r.secs[e.id])??e.sec??(e.one?S.defOne:S.defSym));
const pvOn=()=>false;
const tot=(r,e)=>dur(r,e)*(e.one?2:1)+(e.one?5:0);
const rc=r=>r.col??S.routines.indexOf(r);
const nc=()=>Math.max(-1,...S.routines.map((r,i)=>r.col??i))+1;
const PAL=["#6366f1","#f59e0b","#10b981","#ef4444","#06b6d4","#a855f7"];
function mins(r){const it=r.items.filter(ex).map(ex);const s=it.reduce((a,e)=>a+tot(r,e),0)+rs(r)*Math.max(0,it.length-1);return Math.max(1,Math.round(s/60))}
const tage=n=>n+(n===1?" Tag":" Tage")+" in Folge";
let KA=null;
function ses(){try{if(navigator.audioSession)navigator.audioSession.type=S.ses===false?"auto":"playback"}catch(e){}}
function keep(){try{if(S.ses===false||navigator.audioSession)return;if(!KA){KA=new Audio("data:audio/wav;base64,UklGRmQGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YUAGAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA");KA.loop=true}KA.play().catch(()=>{})}catch(e){}}
function kp(){try{if(KA)KA.pause()}catch(e){}}
function beep(f,ms){try{if(S.snd===false||S.vol===0)return;ses();if(!AC)AC=new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=.3*(S.vol??50)/100;o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+ms/1000)}catch(e){}}
async function wl(on){try{if(on&&navigator.wakeLock)WL=await navigator.wakeLock.request("screen");else if(WL){await WL.release();WL=null}}catch(e){}}

function home(){const n=streak(),nx=nextUp(),favs=S.routines.filter(r=>isFav(r)&&!(nx&&nx.r.id===r.id));
const card=(r,lab)=>{const k=r.items.filter(ex).length;return `<div class="card">${lab?`<p class="mut">${lab}</p>`:""}<h2>${esc(r.name)}</h2><p class="mut">${k} Übungen, ca. ${mins(r)} Min.</p><div class="row"><button class="btn" data-a="start" data-id="${r.id}" ${k?"":"disabled"}>Start</button><button class="btn g" data-a="editr" data-id="${r.id}">Bearbeiten</button></div></div>`};
const wdn=nx?(nx.o===0?"heute":nx.o===1?"morgen":nx.dt.toLocaleDateString("de-DE",{weekday:"long"})):"";
return `<div class="top"><h1>Dehn-Routinen</h1><button class="btn g sm gear" data-a="nav" data-id="set" aria-label="Einstellungen">⚙️</button></div><p class="mut">${n?"🔥 "+tage(n):"Noch keine Serie. Starte heute deine erste Routine."}</p>
${nx?card(nx.r,"Als Nächstes, "+wdn):""}
${favs.map(r=>card(r,"")).join("")}
${!nx&&!favs.length?'<p class="mut">Noch keine Favoriten. Markiere Routinen in der Bibliothek mit dem Stern oder lege im Kalender einen Wochenplan an.</p>':""}
<div class="row"><button class="btn g" data-a="nav" data-id="rlib">Routinen</button><button class="btn g" data-a="nav" data-id="lib">Übungen</button></div>
<div class="row"><button class="btn g" data-a="cal">Kalender</button></div>`}

function play(){const w=P.phase==="work",sw=P.phase==="switch",e=ex(P.ids[P.idx]),nx=ex(P.ids[P.idx+1]),s=Math.ceil(P.left/1000),pos=Math.min(P.ids.length,P.idx+(P.phase==="rest"?2:1));
const pv=pvOn(),imE=P.phase==="rest"?nx:(w?e:null),im=imE&&imE.img?imE.img:"";const title=pv?"NEXT":w?esc(e.name):sw?"Seitenwechsel":(P.idx<0?"Mach dich bereit":"Pause");
const sub=pv?esc(nx.name):w?(e.desc?esc(e.desc):""):sw?"Wechsle auf die andere Seite":"Als Nächstes: "+esc(nx.name);
const foot=pv?"":w?(e.one&&P.side===1?"Danach: Seitenwechsel":(nx?"Danach: "+esc(nx.name):"Letzte Übung")):sw?"Danach: Seite 2 von 2":"";
const side=w&&e.one&&!pv?"Seite "+P.side+" von 2":"";
return `<div class="top"><button class="btn g sm" data-a="stop">Beenden</button><span class="mut">${esc(P.name)}, Übung ${pos} von ${P.ids.length}</span></div>
<div class="ringw ${w?"":"rest"}${im?" hasimg":""}"><svg viewBox="0 0 200 200"><circle class="tr" cx="100" cy="100" r="88"/><circle id="ring" class="pg" cx="100" cy="100" r="88" transform="rotate(-90 100 100)" style="stroke-dasharray:${C};stroke-dashoffset:${C*(1-P.left/P.total)}"/></svg>${im?`<img class="pic" src="${esc(im)}" alt="">`:`<div id="t" class="num">${s}</div>`}</div>
<h1 class="c${pv?" nx":""}">${title}</h1><p id="sd" class="c side">${side}</p><p class="c">${sub}</p><p class="c mut">${foot}</p>${im?`<div id="t" class="tm">${s}</div>`:""}
<div class="row"><button class="btn g" style="padding:14px 8px" data-a="rw">⏪ 5 Sek.</button><button class="btn" style="padding:14px 8px" data-a="pause">${P.paused?"Weiter":"Pause"}</button><button class="btn g" style="padding:14px 8px" data-a="ff">⏩ 5 Sek.</button></div>
<div class="row"><button class="btn g" data-a="skip">Überspringen</button></div>`}

function done(){const n=streak();
return `<div class="c" style="padding-top:60px"><div style="font-size:64px">🎉</div><h1>Geschafft!</h1><p class="mut">${esc(V.name)} ist abgeschlossen.<br>🔥 ${tage(n)}</p><div class="row"><button class="btn" data-a="nav" data-id="home">Zurück</button></div></div>`}

function lib(){
return `<div class="top"><button class="btn g sm" data-a="nav" data-id="home">Zurück</button></div><h1>Übungen</h1>
<div class="card"><h2>Standarddauer</h2><label>Übung ohne Seitenwechsel (Sek.)<input type="number" inputmode="numeric" min="10" max="600" value="${S.defSym}" data-f="defSym"></label><label>Übung mit Seitenwechsel, pro Seite (Sek.)<input type="number" inputmode="numeric" min="10" max="600" value="${S.defOne}" data-f="defOne"></label></div>
${fbar()}

${S.ex.filter(fx).map(e=>`<div class="card"><div class="hd">${e.img?`<img class="th" src="${esc(e.img)}" alt="">`:""}<input data-f="name" data-id="${e.id}" value="${esc(e.name)}" aria-label="Name"></div><textarea data-f="desc" data-id="${e.id}" rows="2" placeholder="Beschreibung (optional)" aria-label="Beschreibung">${esc(e.desc)}</textarea><p class="mut" style="margin:8px 0 0">Gedehnter Körperteil</p><div class="chips">${pchips(e)}</div><label>Eigene Dauer${e.one?" pro Seite":""} in Sek. (leer = Standard)<input type="number" inputmode="numeric" min="10" max="600" value="${e.sec??""}" placeholder="${e.one?S.defOne:S.defSym}" data-f="sec" data-id="${e.id}"></label><label class="chk"><input type="checkbox" data-f="one" data-id="${e.id}" ${e.one?"checked":""} ${e.fixed?"disabled":""}>Seitenwechsel${e.fixed?" (fest vorgegeben)":""}</label>${e.fixed?"":`<button class="btn g sm" data-a="delx" data-id="${e.id}">${V.cx===e.id?"Wirklich löschen?":"Löschen"}</button>`}</div>`).join("")}
${S.ex.filter(fx).length?"":'<p class="mut">Keine Übungen für diesen Körperteil.</p>'}
<button class="plus" data-a="addx"><b>+</b>Neue Übung</button>`}

function edit(){const r=S.routines.find(x=>x.id===V.id),sel=r.items.map(ex).filter(Boolean),rest=S.ex.filter(e=>!r.items.includes(e.id)&&fx(e));
return `<div class="top"><button class="btn g sm" data-a="nav" data-id="${V.from||"home"}">Fertig</button></div><h1>Routine bearbeiten</h1>
<div class="card"><input data-f="rname" value="${esc(r.name)}" aria-label="Name der Routine"><label>Pause zwischen den Übungen (Sekunden)<input type="number" inputmode="numeric" min="0" max="120" value="${rs(r)}" data-f="rrest"></label><label class="chk"><input type="checkbox" data-f="rfav" ${isFav(r)?"checked":""}>Favorit (auf dem Startbildschirm)</label></div>
<h2>In dieser Routine</h2>
${sel.length?sel.map((e,i)=>`<div class="card"><div class="top"><b>${i+1}. ${esc(e.name)}</b><span class="mv"><button class="btn g sm" data-a="up" data-id="${e.id}" aria-label="Nach oben" ${i?"":"disabled"}>▲</button><button class="btn g sm" data-a="dn" data-id="${e.id}" aria-label="Nach unten" ${i<sel.length-1?"":"disabled"}>▼</button></span></div>${tags(e)?`<p class="mut">${esc(tags(e))}</p>`:""}<label>Dauer${e.one?" pro Seite":""} (Sek.)<input type="number" inputmode="numeric" min="10" max="600" value="${dur(r,e)}" data-f="rsec" data-id="${e.id}"></label><button class="btn g sm" data-a="tog" data-id="${e.id}">Entfernen</button></div>`).join(""):'<p class="mut">Noch keine Übungen. Füge unten welche hinzu.</p>'}
<h2>Übung hinzufügen</h2>
${fbar()}
${rest.length?rest.map(e=>`<button class="pick" data-a="tog" data-id="${e.id}"><span class="bd">+</span>${esc(e.name)}<span class="mut">${tags(e)?"&nbsp;"+esc(tags(e)):""}</span></button>`).join(""):'<p class="mut">Keine passenden Übungen übrig.</p>'}
${V.nf?`<div class="card"><h2>Neue Übung</h2><input id="nn" placeholder="Name der Übung" aria-label="Name der neuen Übung"><label>Dauer in Sek. (leer = Standard, bei Seitenwechsel pro Seite)<input id="ns" type="number" inputmode="numeric" min="10" max="600" placeholder="Standard"></label><label class="chk"><input type="checkbox" id="no">Seitenwechsel</label><div class="row"><button class="btn" data-a="addtor">Zur Routine hinzufügen</button><button class="btn g" data-a="nfc">Abbrechen</button></div></div>`:`<button class="plus" data-a="nfo"><b>+</b>Neue Übung</button>`}

function applyTheme(){const t=S.theme;if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);else document.documentElement.removeAttribute("data-theme")}
function mig(s){if(!Array.isArray(s.ex))s.ex=[];if(!Array.isArray(s.routines))s.routines=[];
if((s.ver||1)<2){const old=/^e([1-9]|10)$/;s.ex=[...FIX.map(f=>s.ex.find(e=>e.id===f.id)||{id:f.id,name:f.name,desc:""}),...s.ex.filter(e=>!old.test(e.id)&&!FIX.some(f=>f.id===e.id))];
s.routines.forEach(r=>{const n=(r.items||[]).length;r.items=(r.items||[]).filter(i=>!old.test(i));const lost=n-r.items.length;if(r.secs)Object.keys(r.secs).forEach(i=>{if(old.test(i))delete r.secs[i]});
if(lost&&(r.id==="r1"||r.id==="r2"))r.items=[...(r.id==="r1"?FIX.slice(0,9):FIX.slice(9)).map(f=>f.id),...r.items]});s.ver=2}
if((s.ver||1)<3){s.routines=s.routines.filter(r=>r.id!=="r1"&&r.id!=="r2");if(!s.routines.some(r=>r.id==="rgk"))s.routines.unshift({id:"rgk",name:"Ganzkörper",items:FIX.map(f=>f.id)});s.ver=3}
FIX.forEach(f=>{let x=s.ex.find(e=>e.id===f.id);if(!x){x={id:f.id,name:f.name,desc:""};s.ex.push(x)}x.fixed=true;x.one=!!f.one;x.img=f.img});
if(!Array.isArray(s.plans)||!s.plans.length){s.plans=[{id:"p1",name:"Wochenplan",days:s.plan||{}}];delete s.plan}if(s.plans.every(x=>x.on===undefined)){const k=s.plans.some(x=>x.id===s.ap)?s.ap:s.plans[0].id;s.plans.forEach(x=>x.on=x.id===k)}delete s.ap;return s}
function norm(d){d.done=d.done||[];d.log=d.log||[];d.defSym=d.defSym??30;d.defOne=d.defOne??30;d.rest=d.rest??10;return mig(d)}

function setPhase(ph,ms){P.phase=ph;P.total=ms;P.left=ms;P.end=Date.now()+ms;P.last=null;P.paused=false;P.sw=false;P.pv=false}
function workPhase(){P.idx++;P.side=ex(P.ids[P.idx]).one?1:0;setPhase("work",P.d[P.ids[P.idx]]*1000);beep(880,300)}
function adv(){
if(P.phase==="rest")workPhase();
else if(P.phase==="switch"){P.side=2;setPhase("work",P.d[P.ids[P.idx]]*1000);beep(880,300)}
else if(P.side===1){setPhase("switch",5000);beep(520,300)}
else if(P.idx>=P.ids.length-1){finish();return}
else if(P.rest>0){setPhase("rest",P.rest*1000);beep(520,300)}
else workPhase();
render()}
function tick(){
if(!P||P.paused||V.n!=="play")return;
P.left=P.end-Date.now();
if(P.left<=0){adv();return}
const s=Math.ceil(P.left/1000);
const pv=pvOn();if(pv!==P.pv){P.pv=pv;render(1)}
if(s<=3&&P.last!==s){P.last=s;beep(660,100)}
const t=$("#t"),r=$("#ring");
if(t)t.textContent=s;
if(r)r.style.strokeDashoffset=C*(1-P.left/P.total)}
function pauseT(){if(P.paused){P.end=Date.now()+P.left;P.paused=false}else{P.left=P.end-Date.now();P.paused=true}render()}
function seek(ms){if(P.paused)P.left=Math.min(P.total,Math.max(1000,P.left-ms));else{P.end=Math.min(Date.now()+P.total,Math.max(Date.now()+1000,P.end-ms));P.left=P.end-Date.now()}render()}
function start(id){
const r=S.routines.find(x=>x.id===id),ids=r.items.filter(ex);
if(!ids.length)return;
P={name:r.name,rid:r.id,col:rc(r),ids,idx:-1,rest:rs(r),d:Object.fromEntries(ids.map(i=>[i,dur(r,ex(i))]))};setPhase("rest",5000);
V={n:"play"};beep(660,120);keep();wl(true);clearInterval(T);T=setInterval(tick,200);render()}
function stop(){clearInterval(T);P=null;wl(false);kp();V={n:"home"};render()}
function finish(){clearInterval(T);wl(false);const d=day();
S.log=S.log||[];S.log.push({d,n:P.name,c:P.col,r:P.rid});if(!S.done.includes(d))S.done.push(d);save();
beep(988,500);setTimeout(kp,900);V={n:"done",name:P.name};P=null;render()}

else if(a==="addtor"){const x={id:uid("e"),name:$("#nn").value.trim()||"E"+(S.ex.length+1),desc:"",p:FP?[FP]:[],one:$("#no").checked};const sv=parseInt($("#ns").value,10);if(!isNaN(sv))x.sec=Math.max(10,Math.min(600,sv));S.ex.push(x);R().items.push(x.id);V.nf=false;save()}
else if(a==="addx"){S.ex.push({id:uid("e"),name:"E"+(S.ex.length+1),desc:"",p:FP?[FP]:[]});save()}
else if(a==="delx"){if(ex(id)&&ex(id).fixed){}else if(V.cx!==id)V.cx=id;else{S.ex=S.ex.filter(x=>x.id!==id);S.routines.forEach(r=>r.items=r.items.filter(x=>x!==id));save();V.cx=null}}
render(["tog","addx","delx","addtor","up","dn","sel","cprev","cnext","rfav","rup","rdn","ptog","flt","ptgl","pall","psel","newp","pact","pdup","pdel","nfo","nfc","theme"].includes(a))});
document.addEventListener("change",e=>{
const t=e.target,f=t.dataset.f;if(!f)return;
if(f==="rrest"){const v=parseInt(t.value,10);S.routines.find(r=>r.id===V.id).rest=Math.max(0,Math.min(120,isNaN(v)?10:v))}
else if(f==="rname")S.routines.find(r=>r.id===V.id).name=t.value.trim()||"Routine";
else if(f==="one"){const x=ex(t.dataset.id);if(!x.fixed)x.one=t.checked;render(1)}
else if(f==="rsec"){const r=S.routines.find(r=>r.id===V.id),v=parseInt(t.value,10);r.secs=r.secs||{};if(isNaN(v))delete r.secs[t.dataset.id];else r.secs[t.dataset.id]=Math.max(10,Math.min(600,v));render(1)}
else if(f==="defSym"||f==="defOne"){const v=parseInt(t.value,10);S[f]=Math.max(10,Math.min(600,isNaN(v)?30:v))}
else if(f==="pon"){S.plans.find(x=>x.id===t.dataset.id).on=t.checked}
else if(f==="pname"){const pl=EP();pl.name=t.value.trim()||"Plan";const c=document.querySelector('[data-a="psel"][data-id="'+pl.id+'"]');if(c)c.textContent=pl.name}
else if(f==="rfav"){S.routines.find(r=>r.id===V.id).fav=t.checked}
else if(f==="imp"){const fl=t.files[0];t.value="";if(fl)importB(fl);return}
else if(f==="snd"){S.snd=t.checked;render(1);if(S.snd)beep(660,200)}
else if(f==="ses"){S.ses=t.checked;ses();beep(660,200)}
else if(f==="vol"){S.vol=+t.value;beep(660,200)}
else{const x=ex(t.dataset.id);if(f==="sec"){const v=parseInt(t.value,10);if(isNaN(v))delete x.sec;else x.sec=Math.max(10,Math.min(600,v))}else x[f]=t.value.trim()||(f==="name"?"Übung":"")}
save()});
applyTheme();render();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator)window.addEventListener("load",()=>{navigator.serviceWorker.register("sw.js").catch(()=>{})});
